      var p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date());
      var g = {}; p.forEach(function(x){ g[x.type] = x.value; });
      var asUTC = Date.UTC(+g.year, +g.month - 1, +g.day, (+g.hour) % 24, +g.minute);
      return Math.round((asUTC - Date.now()) / 900000) / 4;
    } catch(e){ return 0; }
  }
  var cities = raw.map(function(c){ var p = proj(c[2], c[3]); return { name:c[0], code:c[1], tz:c[4], x:p.x, y:p.y }; });
  var pct = function(v, t){ return (v / t * 100).toFixed(3) + '%'; };
  var pad = function(n){ return String(n).padStart(2,'0'); };

  cities.forEach(function(c, i){
    var el = document.createElement('span'); el.className = 'pin';
    el.style.left = pct(c.x, 960); el.style.top = pct(c.y, 440);
    el.innerHTML = '<span class="dot"></span><span class="ping" style="animation-delay:' + (i * 0.37).toFixed(2) + 's"></span>';
    $('pins').appendChild(el);
  });

  // orbiting country codes
  ['AE','ES','GB','FR','PT','US','MX','SG','JP','AU'].forEach(function(code, i, arr){
    var a = i / arr.length * Math.PI * 2;
    var s = document.createElement('span');
    s.style.cssText = 'position:absolute;width:0;height:0;left:' + (50 + 50 * Math.cos(a)).toFixed(2) + '%;top:' + (50 + 50 * Math.sin(a)).toFixed(2) + '%';
    s.innerHTML = '<span class="op mono" style="display:block;margin:-14px 0 0 -24px;width:48px;text-align:center;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;font-weight:500;color:#264E43;box-shadow:0 6px 14px rgba(38,78,67,.14)">' + code + '</span>';
    $('orbit').appendChild(s);
  });

  var myTz = ''; try { myTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
  var mine = cities.filter(function(c){ return c.tz === myTz; })[0] || cities[0];
  var zone = { name: mine.name, code: mine.code, off: tzOffsetH(mine.tz), x: mine.x, y: mine.y };

  function clockAt(off){
    var t = Math.floor(Date.now() / 1000) + off * 3600;
    var day = ((t % 86400) + 86400) % 86400;
    var h = Math.floor(day / 3600), m = Math.floor((day % 3600) / 60), s = day % 60;
    return { digital: pad(h)+':'+pad(m)+':'+pad(s), short: pad(h)+':'+pad(m), s: t * 6, m: t / 10, h: t / 120 };
  }
  function utcLabel(o){ return 'UTC' + (o > 0 ? '+' + o : o < 0 ? '−' + Math.abs(o) : '±0'); }
  function setHands(c){
    document.querySelectorAll('.h-h').forEach(function(e){ e.style.transform = 'rotate(' + c.h + 'deg)'; });
    document.querySelectorAll('.h-m').forEach(function(e){ e.style.transform = 'rotate(' + c.m + 'deg)'; });
    document.querySelectorAll('.h-s').forEach(function(e){ e.style.transform = 'rotate(' + c.s + 'deg)'; });
  }
  var cityIdx = 1;
  function render(){
    var c = clockAt(zone.off);
    setHands(c);
    $('zonelbl').textContent = ({ DXB: 'UAE', LON: 'UNITED KINGDOM', MAD: 'SPAIN', LIS: 'PORTUGAL', NYC: 'USA', MEX: 'MEXICO', SAO: 'BRAZIL', CPT: 'SOUTH AFRICA', SIN: 'SINGAPORE', DPS: 'INDONESIA', TYO: 'JAPAN', SYD: 'AUSTRALIA', BKK: 'THAILAND', PAR: 'FRANCE' })[zone.code] || zone.name;
    $('clk').setAttribute('aria-label', 'Clock showing ' + c.digital + ' in ' + zone.name);
    $('you').style.left = pct(zone.x, 960); $('you').style.top = pct(zone.y, 440);
    var a = cities[cityIdx], ac = clockAt(tzOffsetH(a.tz));
    $('act').style.left = pct(a.x, 960); $('act').style.top = pct(a.y, 440);
    $('actcode').textContent = a.code; $('acttime').textContent = a.name + ' ' + ac.short;
    $('actbox').style.left = a.x > 760 ? '-150px' : '-14px';
  }
  render();
  setInterval(render, 1000);
  setInterval(function(){ cityIdx = (cityIdx + 1) % cities.length; render(); }, 2300);

  var dots = 0; setInterval(function(){ dots = (dots + 1) % 4; $('ell').textContent = ['', '.', '..', '...'][dots]; }, 480);

  // rotating pill message: edit the numbers / text here
  var msgs = [{ n: '140', txt: 'DAYS COUNTED' }, { n: '7', txt: 'DAYS TO YOUR NEXT TRIP' }];
  var msgIdx = 1, sT;
  function scramble(){
    var n = 0; clearInterval(sT);
    msgIdx = (msgIdx + 1) % msgs.length;
    var target = msgs[msgIdx].n;
    $('msgtxt').textContent = msgs[msgIdx].txt;
    sT = setInterval(function(){
      n++;
      if (n > 14){ clearInterval(sT); $('scr').textContent = target; return; }
      var v = ''; for (var i = 0; i < target.length; i++) v += (Math.random()*10|0);
      $('scr').textContent = v;
    }, 65);
  }
  setTimeout(scramble, 900); setInterval(scramble, 4200);

  var svg = $('map');
  svg.addEventListener('click', function(e){
    var r = svg.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * 960, y = (e.clientY - r.top) / r.height * 440;
    var best = null, bd = 1e9;
    cities.forEach(function(c){ var d = Math.hypot(c.x - x, c.y - y); if (d < bd){ bd = d; best = c; } });
    if (best) zone = { name: best.name, code: best.code, off: tzOffsetH(best.tz), x: best.x, y: best.y };
    render();
  });

  var cc = $('cc'), spot = $('spot');
  var cx = -100, cy = -100, tx = -100, ty = -100, sx = 480, sy = 220, mx = -1, my = -1, last = 0;
  window.addEventListener('mousemove', function(e){
    tx = e.clientX; ty = e.clientY; last = performance.now();
    if (cx < -50){ cx = tx; cy = ty; }
    var r = svg.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width * 960; my = (e.clientY - r.top) / r.height * 440;
    cc.setAttribute('data-hover', e.target.closest && e.target.closest('a,button,input,.clk') ? '1' : '0');
  }, { passive: true });
  window.addEventListener('mousedown', function(){ cc.setAttribute('data-down', '1'); });
  window.addEventListener('mouseup', function(){ cc.setAttribute('data-down', '0'); });
  document.addEventListener('mouseleave', function(){ tx = ty = cx = cy = -100; last = 0; });
  function loop(now){
    cx += (tx - cx) * .22; cy += (ty - cy) * .22;
    cc.style.transform = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0)';
    var gx, gy;
    if (now - last < 2500 && mx > -40 && mx < 1000 && my > -40 && my < 480){ gx = mx; gy = my; }
    else { var t = now / 1000; gx = 480 + 420 * Math.sin(t * .3); gy = 200 + 120 * Math.sin(t * .67); }
    sx += (gx - sx) * .12; sy += (gy - sy) * .12;
    spot.setAttribute('cx', sx.toFixed(1)); spot.setAttribute('cy', sy.toFixed(1));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var msg = $('msg');
  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('email').value.trim();
    if (email.indexOf('@') < 1) return;
    var ok = function(){ msg.style.color = '#264E43'; msg.style.fontWeight = '600'; msg.textContent = "You're in. We'll tell you the moment the count starts."; $('email').value = ''; };
    if (!WAITLIST_ENDPOINT){ ok(); return; }
    var fd = new FormData(); fd.append('email', email);
    fetch(WAITLIST_ENDPOINT, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } })
      .then(function(r){ if (r.ok) ok(); else throw 0; })
      .catch(function(){ msg.style.color = '#1C2B26'; msg.textContent = 'Something went wrong. Write to us at info@countyourcountry.com'; });
  });
})();
</script>
</body>
</html>
